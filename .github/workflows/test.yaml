name: Test

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The suite runs inside the image, so git-filter-repo is available and
      # nothing has to be installed on the runner.
      - name: Build the test image
        run: docker build -t filters-registry-tests .

      - name: Test
        run: docker run --rm filters-registry-tests
