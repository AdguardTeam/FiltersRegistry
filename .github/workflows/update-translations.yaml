name: Update translations

on:
  workflow_dispatch:
  # Disabled until the Crowdin token issue is fixed (see AG-59539):
  # the weekly run fails at the Download translations step with
  # "Failed to fetch project info. Forbidden" (HTTP 403), so it only
  # produces failure notifications. Re-enable once the
  # CROWDIN_PERSONAL_TOKEN secret grants access to project 17570.
  # schedule:
  #   # Run every Monday at 06:00 UTC
  #   - cron: '0 6 * * 1'

concurrency:
  group: update-translations
  cancel-in-progress: false

jobs:
  update:
    name: Download translations and open a PR
    runs-on: ubuntu-latest
    # Only run on the master branch: a manual dispatch from a feature branch
    # would check out that branch and create the update-translations PR from
    # its HEAD into master. Schedules only fire on the default branch anyway,
    # and the repository check keeps forks from running the workflow at all.
    if: github.ref == 'refs/heads/master' && github.repository == 'AdguardTeam/FiltersRegistry'
    # The download step is network-bound (a single Crowdin CLI call, unlike
    # the 129 sequential curl calls of the Twosky-based download.sh); cap the
    # job runtime so a stalled connection cannot hold the update-translations
    # concurrency group for the GitHub 6-hour default and delay subsequent
    # weekly runs.
    timeout-minutes: 30
    # Push the update-translations branch, create/update the translations PR
    # and post validation-failure comments with the default GITHUB_TOKEN.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Downloads translations from the Crowdin project (adguard-applications,
      # folder miscellaneous/filters-registry) via the Crowdin CLI, bypassing
      # the Twosky gateway that blocks GitHub Actions runner IPs. The token
      # must be added to the repository secrets.
      - name: Download translations
        run: ./download-crowdin.sh
        working-directory: scripts/translations
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Validation must not block PR creation: the branch is pushed and the PR is
      # opened regardless. Validation errors are reported as a PR comment below,
      # and the job is failed at the end to trigger the Slack notification.
      # validate_locales.ts writes the report to report_locales_error.md
      # (gitignored) on failure and removes stale reports otherwise.
      - name: Validate locales
        id: validate
        continue-on-error: true
        run: yarn validate:locales

      # GitHub does not run workflows for push/pull_request events raised with
      # the default GITHUB_TOKEN (create-pull-request uses it), so the
      # translations PR gets no test.yaml/build-adguard checks. Run the same
      # checks here instead; a failure is reported via the Slack notification
      # at the end, like locales validation failures.
      - name: Run lint and tests
        id: lint-test
        continue-on-error: true
        run: yarn lint && yarn test

      # Creates or updates the update-translations branch and its pull request in a
      # single step; does nothing when there are no translation changes. The branch
      # is pushed and the PR is opened regardless of the validation result above.
      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'skip ci: update translations'
          add-paths: locales
          branch: update-translations
          base: master
          title: Update translations
          body: Translations are downloaded from Crowdin by the "Update translations" workflow.

      # Refresh the validation comment whenever the translations PR exists (the
      # action above outputs the PR number both when it creates and updates the
      # PR; it is empty when there are no translation changes). On failure a
      # fresh report comment is posted and previous ones are removed; on success
      # stale failure comments are cleaned up so a fixed translation run does
      # not leave outdated reminders on the PR.
      - name: Report validation results on the PR
        if: steps.create-pr.outputs.pull-request-number != ''
        # Best-effort: a transient GitHub API error while refreshing the comment
        # must not fail the job; the dedicated exit 1 step below is the real
        # failure signal.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn tsx scripts/translations/report-validation.ts --pr-number ${{ steps.create-pr.outputs.pull-request-number }} --result ${{ steps.validate.outcome }}

      # Fail the job so the Slack notification still fires, but only after the branch
      # was pushed, the PR was created/updated, and the failure was reported above.
      - name: Fail the job if validation, lint or tests failed
        if: steps.validate.outcome == 'failure' || steps.lint-test.outcome == 'failure'
        run: exit 1

  notify:
    name: Send Slack notification on failure
    runs-on: ubuntu-latest
    needs: update
    # The notification job only reads repo data, so the default read-only token
    # is enough; do not grant it the write permissions of the update job.
    # `actions: read` is still needed: action-slack resolves the `job` field
    # through the Actions API, and unlisted permission scopes default to none.
    permissions:
      actions: read
      contents: read
    # `always()` keeps the alert on any non-success outcome; `!= 'success'`
    # also covers runs stopped by timeout-minutes, which GitHub reports as
    # 'cancelled' rather than 'failure'. `!= 'skipped'` excludes runs where the
    # update job did not run at all (e.g. a manual dispatch from a feature
    # branch, guarded above), so they do not raise a false alert.
    if:
      ${{
        always() &&
        needs.update.result != 'success' &&
        needs.update.result != 'skipped' &&
        github.repository == 'AdguardTeam/FiltersRegistry'
      }}
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: workflow,repo,message,commit,author,eventName,ref,job
          job_name: Update translations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
