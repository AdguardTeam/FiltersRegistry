name: Update translations

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: update-translations
  cancel-in-progress: false

permissions:
  contents: write      # push the update-translations branch (default GITHUB_TOKEN)
  pull-requests: write # create/update the translations PR
  issues: write        # report locales validation failures as PR comments

jobs:
  update:
    name: Download translations and open a PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download translations
        run: ./download.sh
        working-directory: scripts/translations

      # Validation must not block PR creation: the branch is pushed and the PR is
      # opened regardless. Validation errors are reported as a PR comment below,
      # and the job is failed at the end to trigger the Slack notification.
      # validate_locales.js writes the report to report_locales_error_<date>.md
      # (gitignored) on failure and removes stale reports otherwise.
      - name: Validate locales
        id: validate
        continue-on-error: true
        run: yarn validate:locales

      # Creates or updates the update-translations branch and its pull request in a
      # single step; does nothing when there are no translation changes. The branch
      # is pushed and the PR is opened regardless of the validation result above.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'skip ci: update translations'
          add-paths: locales
          branch: update-translations
          base: master
          title: Update translations
          body: Translations are downloaded from Crowdin by the "Update translations" workflow.

      - name: Report validation failure on the PR
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:update-translations`,
              per_page: 1,
            });
            if (prs.length === 0) {
              core.warning('No open translations PR found to report the validation failure');
              return;
            }
            const prNumber = prs[0].number;

            // Delete previous validation failure comments so that the new one
            // acts as a reminder without cluttering the PR.
            const MARKER = '<!-- update-translations:locales-validation-failure -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.body && comment.body.includes(MARKER)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
                core.info(`Deleted previous validation failure comment ${comment.id}`);
              }
            }

            // Report names embed a DD-MM-YYYY_HH-MM-SS timestamp, so sorting is
            // chronological and the last entry is the most recent report.
            let report = '';
            try {
              const reports = fs.readdirSync(process.cwd())
                .filter((name) => name.startsWith('report_locales_error_') && name.endsWith('.md'))
                .sort();
              if (reports.length > 0) {
                report = fs.readFileSync(path.join(process.cwd(), reports[reports.length - 1]), 'utf8').trim();
              }
            } catch (e) {
              core.warning(`Could not read the locales validation report: ${e.message}`);
            }
            // GitHub comment body limit is 65536 characters; keep the tail of the report.
            const MAX_LOG_LENGTH = 60000;
            if (report.length > MAX_LOG_LENGTH) {
              report = `... (truncated) ...\n${report.slice(-MAX_LOG_LENGTH)}`;
            }
            const body = [
              MARKER,
              '**`yarn validate:locales` failed** for the downloaded translations.',
              'The PR was created anyway so the changes can be inspected and fixed.',
              '',
              '<details><summary>Validation report</summary>',
              '',
              report || 'No validation report was captured.',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.info(`Posted validation failure comment to PR #${prNumber}`);

      # Fail the job so the Slack notification still fires, but only after the branch
      # was pushed, the PR was created/updated, and the failure was reported above.
      - name: Fail the job if locales validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

  notify:
    name: Send Slack notification on failure
    runs-on: ubuntu-latest
    needs: update
    if:
      ${{
        always() &&
        needs.update.result == 'failure' &&
        github.repository == 'AdguardTeam/FiltersRegistry'
      }}
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: workflow,repo,message,commit,author,eventName,ref,job
          job_name: Update translations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
