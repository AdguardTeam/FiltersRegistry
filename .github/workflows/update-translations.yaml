name: Update translations

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: update-translations
  cancel-in-progress: false

jobs:
  update:
    name: Download translations and open a PR
    runs-on: ubuntu-latest
    # Push the update-translations branch, create/update the translations PR
    # and post validation-failure comments with the default GITHUB_TOKEN.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download translations
        run: ./download.sh
        working-directory: scripts/translations

      # Validation must not block PR creation: the branch is pushed and the PR is
      # opened regardless. Validation errors are reported as a PR comment below,
      # and the job is failed at the end to trigger the Slack notification.
      # validate_locales.ts writes the report to report_locales_error_<date>.md
      # (gitignored) on failure and removes stale reports otherwise.
      - name: Validate locales
        id: validate
        continue-on-error: true
        run: yarn validate:locales

      # Creates or updates the update-translations branch and its pull request in a
      # single step; does nothing when there are no translation changes. The branch
      # is pushed and the PR is opened regardless of the validation result above.
      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'skip ci: update translations'
          add-paths: locales
          branch: update-translations
          base: master
          title: Update translations
          body: Translations are downloaded from Crowdin by the "Update translations" workflow.

      # Refresh the validation comment whenever the translations PR exists (the
      # action above outputs the PR number both when it creates and updates the
      # PR; it is empty when there are no translation changes). On failure a
      # fresh report comment is posted and previous ones are removed; on success
      # stale failure comments are cleaned up so a fixed translation run does
      # not leave outdated reminders on the PR.
      - name: Report validation results on the PR
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn tsx scripts/translations/report-validation.ts --pr-number ${{ steps.create-pr.outputs.pull-request-number }} --result ${{ steps.validate.outcome }}

      # Fail the job so the Slack notification still fires, but only after the branch
      # was pushed, the PR was created/updated, and the failure was reported above.
      - name: Fail the job if locales validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

  notify:
    name: Send Slack notification on failure
    runs-on: ubuntu-latest
    needs: update
    # The notification job only reads repo data, so the default read-only token
    # is enough; do not grant it the write permissions of the update job.
    permissions:
      contents: read
    if:
      ${{
        always() &&
        needs.update.result == 'failure' &&
        github.repository == 'AdguardTeam/FiltersRegistry'
      }}
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: workflow,repo,message,commit,author,eventName,ref,job
          job_name: Update translations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
