name: Compression tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/repository/**'
      - '.github/docker/**'
      - '.github/workflows/compression-tests.yaml'
  schedule:
    # Monthly, so a new git-filter-repo release is caught before the annual window.
    - cron: '0 3 1 * *'

concurrency:
  group: compression-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compression-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The tests drive the real git-filter-repo, which the runner does not have.
      - name: Build the compression test image
        run: docker build -t filters-registry-compression-tests .github/docker

      - name: Run the repository compression tests
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" filters-registry-compression-tests \
            yarn vitest run scripts/repository/__tests__/compress.test.ts
