project_id: "365951"
api_token_env: "CROWDIN_FILTERS_REGISTRY_TOKEN"
preserve_hierarchy: true

# Local output root: translations land in temp/crowdin/<locale>/<file>. The
# directory must exist before the CLI runs, so download-crowdin.sh creates it.
base_path: "temp/crowdin"

# Keep the download limited to the locales this repo tracks. The codes are
# Crowdin language IDs; the Twosky codes es/pt/sv/hy are es-ES/pt-PT/sv-SE/
# hy-AM in Crowdin, and the repo's `sr` is `sr-CS` (Serbian (Latin)) there.
# `en` is downloaded like in the old download.sh.
#
# This list is the single source for the language set: download-crowdin.sh
# imports exactly the locale dirs this download produces, so adding a language
# here is enough to have it downloaded and imported.
export_languages:
  - ar
  - be
  - bg
  - ca
  - cs
  - da
  - de
  - el
  - en
  - es-ES
  - fa
  - fi
  - fr
  - he
  - hi
  - hr
  - hu
  - hy-AM
  - id
  - it
  - ja
  - ko
  - lt
  - mk
  - ms
  - nl
  - no
  - pl
  - pt-BR
  - pt-PT
  - ro
  - ru
  - sk
  - sl
  - sr-CS
  - sv-SE
  - th
  - tr
  - uk
  - vi
  - zh-CN
  - zh-TW

# Map Crowdin language IDs to the locale directory names used in this repo.
# The mapping key must be `language_id` because `%language_id%` drives the
# local path: pt-BR/pt-PT/es-ES keep underscores, zh-CN is stored as `zh`, the
# two-letter repo dirs sv/hy/sr keep their names (sv-SE -> sv, hy-AM -> hy,
# sr-CS -> sr). es_ES/pt_PT are additionally copied to the base es/pt alias
# dirs by download-crowdin.sh: validate_locales.ts requires those dirs and the
# compiler consumes them.
# Note: &/* is Yaml anchor syntax: https://support.atlassian.com/bitbucket-cloud/docs/yaml-anchors/
languages_mapping: &languages_mapping
  language_id:
    pt-BR: pt_BR
    pt-PT: pt_PT
    zh-CN: zh
    zh-TW: zh_TW
    es-ES: es_ES
    sv-SE: sv
    hy-AM: hy
    sr-CS: sr

files:
  # These project files were uploaded by the legacy Twosky flow, so Crowdin
  # keeps the default export layout `<language_id>/<original_path>/<original_file_name>`
  # for them. The `translation` pattern mirrors that layout, so the CLI can
  # match the downloaded archive; `translation_replace` then strips the project
  # folder from the local path, and `base_path` puts the result under
  # temp/crowdin.
  # The pattern and the replace map are the same for every file, so they are
  # anchored on the first entry and reused below.
  - source: /source/tags.json
    dest: /miscellaneous/filters-registry/tags.json
    translation: &translation /%language_id%/%original_path%/%original_file_name%
    translation_replace: &translation_replace
      "miscellaneous/filters-registry/": ""
    languages_mapping: *languages_mapping
  - source: /source/groups.json
    dest: /miscellaneous/filters-registry/groups.json
    translation: *translation
    translation_replace: *translation_replace
    languages_mapping: *languages_mapping
  - source: /source/filters.json
    dest: /miscellaneous/filters-registry/filters.json
    translation: *translation
    translation_replace: *translation_replace
    languages_mapping: *languages_mapping
